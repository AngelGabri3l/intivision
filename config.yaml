zone_name: "Cuadra 01 - Piloto"

# Fuente: "0"=webcam | "video.mp4"=archivo | "rtsp://..."=camara real
source: "0"

detector:
  model: "yolo11n.pt"
  conf: 0.5
  device: null

# ---- PUNTAJE DE AMENAZA ----
scoring:
  weights:
    person_present: 1
    in_restricted_zone: 3
    sensitive_hour: 2
    loitering: 2
    group: 2
    # postura
    climbing: 3
    fallen: 3
    hands_up: 3
  thresholds:
    medium: 3
    high: 6
  loitering_seconds: 15
  group_size: 3
  sensitive_hours: [22, 6]
  persistence_frames: 5
  window: 8
  restricted_zone: []

# ---- POSTURA (YOLO-Pose) ----
pose:
  enabled: true
  model: "yolo11n-pose.pt"
  conf: 0.4
  device: null

actuator:
  type: "mqtt"         
  siren_seconds: 10
  host: "broker.hivemq.com"
  port: 1883
  topic: "guardian/demo7k3x9/siren"
  username: null       
  password: null       

notifier:
  events_dir: "events"
  telegram_token: null
  telegram_chat_id: null

clip:
  enabled: true
  seconds: 15
  fps: 8
  max_width: 640
