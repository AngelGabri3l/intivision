zone_name: "Cuadra 01 - Piloto"

# Fuente: "0"=webcam | "video.mp4"=archivo | "rtsp://..."=camara real
source: "0"

detector:
  model: "yolo11n.pt"
  conf: 0.5
  device: null
  # Tamaño de entrada del modelo. null = el de fábrica (640). Más chico (por ejemplo 416 o 320) analiza más rápido, pero ve peor a
  # quien está lejos o es pequeño en la imagen: pruébalo con tus clips antes de dejarlo.
  imgsz: null

# ---- PUNTAJE DE AMENAZA ----
scoring:
  weights:
    person_present: 1
    in_restricted_zone: 3
    sensitive_hour: 2
    loitering: 2
    group: 2
    proximity: 1      # dos personas muy juntas (cercanía entre personas)
    # postura
    climbing: 3
    fallen: 3
    hands_up: 3
  thresholds:
    medium: 3
    high: 6
  # Merodeo (por persona): UNA MISMA persona permanece casi en el mismo sitio durante estos segundos, dentro de la
  # zona de la cámara si hay una definida. Quien cruza el cuadro sin detenerse no suma.
  loitering_seconds: 15
  loitering_radius_h: 0.8   # «casi en el mismo sitio» = se mueve menos de 0,8 alturas de su propio cuerpo
  # Cercanía entre personas: la distancia entre los centros de dos personas es menor que proximity_ratio veces su
  # altura media, durante al menos proximity_seconds seguidos.
  proximity_ratio: 0.6
  proximity_seconds: 1.5
  # Seguimiento de personas (identificador que se conserva entre cuadros)
  tracking:
    max_lost_s: 4.0         # cuánto tiempo se recuerda a una persona que dejó de detectarse
    min_hits: 2             # cuántas veces hay que detectarla para confirmarla (una detección de un solo cuadro no cuenta)
    loiter_gap_s: 2.0       # si no se ve a una persona más de estos segundos, su conteo de merodeo vuelve a empezar (puede ser otra persona)
  # Posturas (trepar, en el suelo, manos arriba): se asignan a UNA persona y deben sostenerse estos segundos. Un gesto de un solo cuadro,
  # o de personas distintas en cuadros distintos, no cuenta. Con 0 cuentan al instante (como antes de H3).
  posture_hold_s:
    fallen: 2.0             # «persona en el suelo»: una caída real se sostiene; agacharse o girar un momento no
    hands_up: 1.0
    climbing: 1.5
  posture_gap_s: 2.0        # una postura que no se reconoce un cuadro suelto no se pierde si vuelve a verse antes de estos segundos
  posture_min_ratio: 0.65   # ...pero debe verse en al menos esta fracción de los análisis del tramo: así las clasificaciones sueltas erróneas no se suman
  group_size: 3
  sensitive_hours: [22, 6]
  persistence_frames: 5
  window: 8
  restricted_zone: []

# ---- POSTURA (YOLO-Pose) ----
pose:
  enabled: true
  model: "yolo11n-pose.pt"
  conf: 0.4
  device: null
  imgsz: null           # igual que detector.imgsz, para el modelo de postura
  # Cada cuántos análisis se corre la postura (1 = siempre, 2 = uno sí y uno no). La postura se sostiene entre medias, así que a 1 o 3
  # cuadros por segundo casi no se nota, y ahorra la parte más pesada del análisis.
  every_n: 1
  # true = no se carga el detector de personas: el modelo de postura detecta a las personas y sus puntos en UNA sola pasada.
  # Conviene cuando casi siempre hay gente a la vista; con la escena vacía casi todo el tiempo, el detector chico cuesta menos.
  single_model: false

analysis:
  sample_every: 3      
  event_cooldown_s: 5   
  dispatch_alerts: true 

actuator:
  type: "mqtt"         
  siren_seconds: 10
  host: "broker.hivemq.com"
  port: 1883
  topic: "guardian/demo7k3x9/siren"
  username: null       
  password: null       

notifier:
  events_dir: "events"
  telegram_token: null
  telegram_chat_id: null

clip:
  enabled: true
  seconds: 15
  fps: 8
  max_width: 640
