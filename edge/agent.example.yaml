# Configuración del agente. Cópialo a edge/data/agent.yaml (ese archivo NO se sube a git:
# puede llevar contraseñas de cámaras; en la mini PC, protégelo con: chmod 600 data/agent.yaml).
#
# La conexión con el servidor (SERVER_URL y EDGE_TOKEN) NO va aquí: va en edge/.env.

poll_seconds: 5            # cada cuántos segundos se buscan cámaras USB (conexión en caliente)
onvif_enabled: true        # descubrir cámaras ONVIF en la red
onvif_poll_seconds: 60     # cada cuántos segundos se repite el descubrimiento ONVIF

heartbeat_seconds: 30      # cada cuántos segundos manda su inventario al servidor y le pide su configuración

analysis:                  # la detección con el motor (necesita la imagen construida con MOTOR=1)
  enabled: true            # false = solo cámaras: lee, manda inventario y recibe configuración, pero no analiza
  fps: 3                   # cuadros por segundo que se intenta analizar por cámara (si el equipo no alcanza, se analizan menos)
  event_cooldown_s: 10     # tiempo mínimo entre dos eventos de una misma cámara (el servidor, además, limita los avisos por Telegram)
  max_gap_s: 10            # si una cámara estuvo sin cuadros más de esto, se reinicia su análisis (no se arrastra el merodeo)

live:                      # la imagen en vivo que ven los vecinos desde el celular (la pide el servidor; sin pedido no se envía nada)
  enabled: true
  max_streams: 4           # cámaras en vivo a la vez
  width: 640               # ancho de la imagen
  jpeg_quality: 70         # calidad JPEG (más baja = menos datos)

queue:                     # eventos que no se pudieron enviar (sin internet): se guardan en disco y se envían en orden al volver
  max_mb: 200              # tope de tamaño; si se pasa, se descarta lo más viejo
  max_age_h: 24            # tope de antigüedad

capture:                   # cómo se abren las cámaras USB (se ajusta a lo que cada cámara admita)
  width: 640
  height: 480
  fps: 15
  pixel_format: auto       # auto | mjpg | yuyv. Si en los registros ves "Corrupt JPEG data", prueba yuyv

# SOLO se usa si NO hay servidor configurado (modo local, para probar cámaras). Con servidor, el administrador
# decide qué cámaras se leen asignándolas desde el panel, y esta lista se ignora.
assigned:
  - usb:/dev/v4l/by-id/usb-EJEMPLO_Camara_USB-video-index0
  - rtsp:puerta

# Cámaras sin ONVIF (o que no se descubren): se declaran con su dirección RTSP.
# El nombre solo admite letras, números, guion y guion bajo.
rtsp:
  - name: puerta
    url: rtsp://usuario:clave@192.168.1.50:554/stream2
